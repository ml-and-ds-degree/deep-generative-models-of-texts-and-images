[project]
name = "deep-generative-models-of-texts-and-images"
version = "0.1.0"
description = "Reproducible modern reconstructions of deep generative models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "cyclopts>=4.21.1",
    "lightning>=2.6.5",
    "torch>=2.13.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "matplotlib>=3.11.0",
    "numpy>=1.26.4",
    "scikit-learn>=1.9.0",
    "ipykernel>=7.3.0",
]

[project.scripts]
iwae = "iwae_reproduction.cli:app"
made = "made_reproduction.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwae_reproduction", "src/made_reproduction"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
